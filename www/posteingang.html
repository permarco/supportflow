<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SupportFlow · Posteingang mit Assistent</title>
<link rel="stylesheet" href="/variablen.css">
<style>
  body { margin: 0; font: var(--schrift); background: var(--bg); color: var(--fg); }
  header { padding: var(--abstand-2) var(--abstand-3); border-bottom: 1px solid var(--linie); font-weight: 700; display: flex; gap: var(--abstand-3); }
  header a { color: var(--fg-schwach); font-weight: 400; }
  main { display: grid; grid-template-columns: minmax(18rem, 2fr) 3fr; min-height: calc(100vh - 3.5rem); }
  #links { border-right: 1px solid var(--linie); }
  #filter { display: flex; gap: var(--abstand-1); padding: var(--abstand-2); border-bottom: 1px solid var(--linie); }
  #filter button { font: inherit; padding: .15rem .7rem; border-radius: 999px; border: 1px solid var(--rahmen);
                   background: transparent; color: var(--fg-schwach); cursor: pointer; }
  #filter button[aria-pressed=true] { color: var(--fg); border-color: var(--fg); }
  #liste .zeile[aria-current] { background: var(--bg-2); box-shadow: inset 3px 0 var(--fokus); }
  #detail { padding: var(--abstand-3); }
  #detail h2 { margin: 0 0 var(--abstand-1); font-size: 1.3rem; }
  #detail .chips { display: flex; gap: var(--abstand-1); align-items: center; margin: 0 0 var(--abstand-2); }
  #detail .text { white-space: pre-wrap; }
  .meldung { margin: var(--abstand-2); padding: .8rem 1rem; border: 1px solid var(--fehler); border-radius: var(--radius); color: var(--fehler); }
  .meldung button { margin-left: .8rem; font: inherit; padding: .2rem .7rem; }
  .leer { margin: var(--abstand-2); color: var(--fg-schwach); }
  /* Assistent */
  #assistent { margin-top: var(--abstand-3); border-top: 1px dashed var(--linie); padding-top: var(--abstand-2); display: flex; flex-direction: column; gap: var(--abstand-1); }
  #assistent .kopf { display: flex; align-items: center; gap: var(--abstand-1); }
  #assistent button { font: inherit; padding: .3rem .8rem; border-radius: var(--radius); border: 1px solid var(--rahmen); background: var(--bg-2); color: var(--fg); cursor: pointer; }
  #assistent button:disabled { opacity: .45; cursor: default; }
  #assistent button.primaer { border-color: var(--fokus); color: var(--fokus); }
  #assistent button.stopp { border-color: var(--fehler); color: var(--fehler); }
  #zustand { font: var(--mono); color: var(--fg-schwach); margin-left: auto; }
  #zustand[data-zustand="fehler"] { color: var(--fehler); }
  #zustand[data-zustand="abgebrochen"] { color: var(--offen); }
  #vorschlag { display: flex; gap: var(--abstand-1); align-items: center; flex-wrap: wrap; min-height: 1.6rem; }
  #vorschlag .chip-vorschlag { cursor: pointer; background: transparent; font: inherit; }
  #vorschlag .chip-vorschlag[aria-pressed="true"] { background: var(--bg-2); box-shadow: inset 0 0 0 1px var(--fokus); }
  #begruendung { color: var(--fg-schwach); font-style: italic; }
  #entwurf { width: 100%; min-height: 6rem; font: inherit; color: var(--fg); background: var(--bg-2); border: 1px dashed var(--offen); border-radius: var(--radius); padding: .6rem; box-sizing: border-box; resize: vertical; }
  #entwurf-hinweis { font: var(--mono); color: var(--offen); }
  #aktionen { display: flex; gap: var(--abstand-1); flex-wrap: wrap; }
  #antwort { width: 100%; min-height: 5rem; font: inherit; color: var(--fg); background: var(--bg-2); border: 1px solid var(--rahmen); border-radius: var(--radius); padding: .6rem; box-sizing: border-box; resize: vertical; }
  .meldung.klein { margin: 0; padding: .5rem .8rem; }
</style>
</head>
<body>
<header>SupportFlow · Posteingang <a href="/">Statusübersicht</a></header>
<main>
  <section id="links" aria-label="Tickets">
    <nav id="filter" aria-label="Filter nach Status"></nav>
    <div id="liste"></div>
  </section>
  <article id="detail" aria-live="polite"></article>
</main>
<script type="module" src="/posteingang.js"></script>
<script type="module" src="/assistent.js"></script>
</body>
</html>
